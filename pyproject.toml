[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relunet"
version = "0.1.0"
description = "Two-layer ReLU network trained with gradient descent in pure NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "rich",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/relunet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
