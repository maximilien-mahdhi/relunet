[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relunet"
version = "0.1.0"
description = "Two-layer ReLU network trained with gradient descent in pure NumPy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/relunet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
